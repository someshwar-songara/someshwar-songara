<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 220" width="100%" height="100%">
    <defs>
          <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
                  <stop offset="0%" stop-color="#0d1117" />
                  <stop offset="50%" stop-color="#161b22" />
                  <stop offset="100%" stop-color="#0d1117" />
          </linearGradient>
          <linearGradient id="glow" x1="0%" y1="0%" x2="100%" y2="0%">
                  <stop offset="0%" stop-color="#58a6ff" />
                  <stop offset="50%" stop-color="#bc8cff" />
                  <stop offset="100%" stop-color="#ff7b72" />
          </linearGradient>
          <style>
                  .title { font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; font-weight: 800; font-size: 44px; fill: url(#glow); }
                  .subtitle { font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; font-weight: 600; font-size: 16px; fill: #8b949e; letter-spacing: 4px; }
                  .grid { stroke: rgba(88, 166, 255, 0.08); stroke-width: 1.5; stroke-dasharray: 4 6; }
                  .dot { fill: rgba(88, 166, 255, 0.4); }
                  .keyword { fill: #ff7b72; font-weight: bold; }
                  .string { fill: #a5d6ff; }
                  .code { font-family: 'Courier New', Courier, monospace; font-size: 13px; fill: #c9d1d9; }
          </style>
    </defs>
    <rect width="800" height="220" fill="url(#bg)" rx="12" stroke="#30363d" stroke-width="1.5" />
    <line x1="0" y1="55" x2="800" y2="55" class="grid" />
    <line x1="0" y1="110" x2="800" y2="110" class="grid" />
    <line x1="0" y1="165" x2="800" y2="165" class="grid" />
    <line x1="200" y1="0" x2="200" y2="220" class="grid" />
    <line x1="400" y1="0" x2="400" y2="220" class="grid" />
    <line x1="600" y1="0" x2="600" y2="220" class="grid" />
    <circle cx="700" cy="80" r="100" fill="#ff7b72" opacity="0.06" filter="blur(35px)" />
    <circle cx="150" cy="140" r="90" fill="#58a6ff" opacity="0.06" filter="blur(35px)" />
    <circle cx="60" cy="40" r="3" class="dot" />
    <circle cx="710" cy="180" r="2.5" class="dot" />
    <circle cx="340" cy="25" r="4" class="dot" opacity="0.6" />
    <circle cx="650" cy="70" r="2" class="dot" />
    <path d="M 50,195 L 450,195" stroke="url(#glow)" stroke-width="3" stroke-linecap="round" opacity="0.8" />
    <circle cx="450" cy="195" r="5" fill="#ff7b72" />
    <text x="50" y="90" class="title">Someshwar Songara</text>
    <text x="50" y="125" class="subtitle">SOFTWARE DEVELOPER &amp; CSE STUDENT</text>
    <g transform="translate(480, 45)">
          <rect width="270" height="130" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1.5" />
          <circle cx="15" cy="15" r="4" fill="#ff5f56" />
          <circle cx="27" cy="15" r="4" fill="#ffbd2e" />
          <circle cx="39" cy="15" r="4" fill="#27c93f" />
          <text x="15" y="45" class="code"><tspan class="keyword">const</tspan> developer = {</text>
          <text x="30" y="65" class="code">name: <tspan class="string">"Someshwar"</tspan>,</text>
          <text x="30" y="85" class="code">skills: [<tspan class="string">"Web"</tspan>, <tspan class="string">"Android"</tspan>],</text>
          <text x="30" y="105" class="code">status: <tspan class="string">"Building..."</tspan></text>
          <text x="15" y="125" class="code">};</text>
    </g>
</svg>
